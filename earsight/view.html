<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earsight — viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #e6e8ec; font: 16px system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    #go { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 0; background: rgba(0,0,0,.7); color: #fff; font-size: 8vw; }
    #go[hidden] { display: none; }
    #state { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; color: #9aa1ad; font-size: 14px; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="c" aria-label="Vision display"></canvas>
  <button id="go" aria-label="Tap anywhere to start the sound and the display">Tap to start</button>
  <div id="state" role="status"></div>
  <script type="module" src="/src/viewer.ts"></script>
</body>
</html>
